name: WordPress integration smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wordpress:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          coverage: none
      - name: Install WP-CLI
        run: |
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar --info
      - name: Set up WordPress
        run: |
          mkdir -p /tmp/mwa-wp
          php /tmp/wp-cli.phar core download --path=/tmp/mwa-wp --quiet
          php /tmp/wp-cli.phar config create --path=/tmp/mwa-wp --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check --quiet
          php /tmp/wp-cli.phar core install --path=/tmp/mwa-wp --url=http://localhost --title="MWA CI" --admin_user=mwaadmin --admin_password=testing-only-not-a-secret --admin_email=admin@example.test --skip-email --quiet
          mkdir -p /tmp/mwa-wp/wp-content/plugins/mainwp-wordfence-audit
          cp mainwp-wordfence-audit.php /tmp/mwa-wp/wp-content/plugins/mainwp-wordfence-audit/
          php /tmp/wp-cli.phar plugin activate mainwp-wordfence-audit --path=/tmp/mwa-wp
      - name: Test fresh install and upgrade-state preservation
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/install-upgrade-lifecycle.php" --path=/tmp/mwa-wp
      - name: Run WordPress integration assertions
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/wordpress-smoke.php" --path=/tmp/mwa-wp
      - name: Test scanner HTTP-to-cache refresh
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/scanner-refresh.php" --path=/tmp/mwa-wp
      - name: Test production CVSS enrichment
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/severity-refresh.php" --path=/tmp/mwa-wp
      - name: Test notification cron baseline and deduplication
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/notification-cron.php" --path=/tmp/mwa-wp
      - name: Test legacy JSON to database migration
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/database-cache-migration.php" --path=/tmp/mwa-wp
      - name: Test opt-in refresh schedule and rollback
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration/refresh-scheduling.php" --path=/tmp/mwa-wp
      - name: Build and validate distributable ZIP
        run: |
          mkdir -p dist/mainwp-wordfence-audit
          cp mainwp-wordfence-audit.php README.md readme.txt LICENSE dist/mainwp-wordfence-audit/
          if [ -d includes ]; then cp -R includes dist/mainwp-wordfence-audit/; fi
          if [ -d assets ]; then cp -R assets dist/mainwp-wordfence-audit/; fi
          (cd dist && zip -qr mainwp-wordfence-audit.zip mainwp-wordfence-audit)
          unzip -t dist/mainwp-wordfence-audit.zip
          unzip -Z1 dist/mainwp-wordfence-audit.zip | grep -Fx 'mainwp-wordfence-audit/mainwp-wordfence-audit.php'
          unzip -Z1 dist/mainwp-wordfence-audit.zip | grep -Fx 'mainwp-wordfence-audit/LICENSE'
          unzip -Z1 dist/mainwp-wordfence-audit.zip | grep -Fx 'mainwp-wordfence-audit/readme.txt'
          if unzip -Z1 dist/mainwp-wordfence-audit.zip | grep -E '(^|/)(tests|vendor|\.git|\.idea)/'; then
            echo "Unexpected development file in release ZIP"
            exit 1
          fi
      - name: Install release ZIP through WordPress and activate
        run: |
          php /tmp/wp-cli.phar plugin deactivate mainwp-wordfence-audit --path=/tmp/mwa-wp --quiet || true
          php /tmp/wp-cli.phar plugin delete mainwp-wordfence-audit --path=/tmp/mwa-wp
          php /tmp/wp-cli.phar plugin install "$GITHUB_WORKSPACE/dist/mainwp-wordfence-audit.zip" --activate --path=/tmp/mwa-wp
          php /tmp/wp-cli.phar plugin is-active mainwp-wordfence-audit --path=/tmp/mwa-wp
          php /tmp/wp-cli.phar eval 'if (!MWA_Audit::ensure_cache_table()) { WP_CLI::error("ZIP-installed plugin cannot initialize database cache"); }' --path=/tmp/mwa-wp
      - name: Upload installable ZIP from CI
        uses: actions/upload-artifact@v4
        with:
          name: mainwp-wordfence-audit-ci-zip
          path: dist/mainwp-wordfence-audit.zip
